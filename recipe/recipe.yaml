context:
  version: "0.2.0"

package:
  name: numba-cfunc-compiler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/numba-cfunc-compiler/numba_cfunc_compiler-${{ version }}.tar.gz
  sha256: 384cafed034eafb5ef7fe55d2ccf9f9013a0c0fbe025af03c3ff6217e59c4c9e

build:
  number: 1
  python:
    version_independent: true
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: is_abi3 and not is_python_min

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
        - hatch-cpp
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - hatchling
    - hatch-cpp
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python
    - numba >=0.64
    - llvmlite >=0.46

tests:
  - python:
      imports:
        - numba_cfunc_compiler
        - numba_cfunc_compiler.numba_rt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %PREFIX%/Lib/site-packages/numba_cfunc_compiler/numba_rt/_py_nrt_init.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else:
            - export SP_DIR=$(python -c "import site; print(site.getsitepackages()[0])")
            - abi3audit $SP_DIR/numba_cfunc_compiler/numba_rt/_py_nrt_init.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - abi3audit

about:
  homepage: https://github.com/Point72/numba-cfunc-compiler
  summary: 'Generic, framework-agnostic infrastructure for compiling Python functions to Numba @cfunc via AST transformation'
  description: |
    Generic, framework-agnostic infrastructure for compiling Python functions to Numba @cfunc via AST transformation
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://github.com/Point72/numba-cfunc-compiler/wiki
  repository: https://github.com/Point72/numba-cfunc-compiler

extra:
  recipe-maintainers:
    - ptomecek
    - timkpaine
